    <script>
       $(document).ready(async function(){
            const urlParams = new URLSearchParams(window.location.search);
  const patientId = urlParams.get('patientId');
            const resp = await fetch('http://localhost:5000/patientmedhis', {
  method: 'POST',
  headers: {
    'Content-Type': 'application/json'
  },
  body: JSON.stringify({ patient: patientId })
});

const data1 = await resp.json();
console.log(data1);
// Corrected assignment statement
const appointments = data1.name;

var appoint = document.getElementById('appointments-list');
appoint.innerHTML = ''; // Clear existing list before adding new appointments

appointments.forEach(element => {
  var li = document.createElement('li');
  if(element.appoint_time===null){
    element.appoint_time='Not Assigned';
  }
  if(element.status==='Done'){
    // Remove the 'continue' statement
  }
  else{
    li.innerHTML = '<b>Doctor: </b>' + element.doctor_name + '&nbsp&nbsp&nbsp' +
               ' <b>Date:</b> ' + element.rec_date + '&nbsp&nbsp&nbsp' +
               ' <b>Diagnosis:</b> ' + element.diagnosis + '&nbsp&nbsp&nbsp' + 
               ' <b>Prescription Id:</b>' + element.rec_id
  appoint.appendChild(li);
  }
});
          })
const urlParams1 = new URLSearchParams(window.location.search);
function redirectToAppointment() {
  const urlParams = new URLSearchParams(window.location.search);
  const patientId = urlParams.get("patientId");
  window.location.href = `patient-appointment.html?patientId=${patientId}`;
}
function redirecttomedhis() {
  const urlParams = new URLSearchParams(window.location.search);
  const patientId = urlParams.get("patientId");

}
function redirectTopres() {
  const urlParams = new URLSearchParams(window.location.search);

}
function redirectTodashboard() {

  window.location.href = `patient-dashboard.html?patientId=${patientId}`;
}
