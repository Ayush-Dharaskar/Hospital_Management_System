<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Appointments</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Style for the modal */
  .modal {

    position: fixed; /* Stay in place */
    z-index: 1; /* Sit on top */
    left: 0;
    top: 0;

    overflow: auto; /* Enable scroll if needed */

  }
  .modal-content {
    background-color: #fefefe;
    margin: 15% auto;

  }

<body>

<div class="container">
  <!-- Drawer Menu -->
  <div class="drawer">
    <ul>
      <li><a href="patient-dashboard.html">Dashboard</a></li>
      <li><a href="index.html">Medical Records</a></li>
      <li><a href="#">Prescription</a></li>
      <li><a href="#">Appointments</a></li>
    </ul>
  </div>
  
  <!-- Main Content -->
  <div class="main-content">
    <h1>Appointments</h1>
    <div class="appointment-list">
      <h2>List of Appointments</h2>
      <ul id="appointments-list">
        <!-- Appointments will be dynamically inserted here -->
      </ul>
    </div>
    <button id="open-appointment-dialog">Book Appointment</button>
  </div>
</div>

<!-- Appointment Dialog -->
<div id="appointment-dialog" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>Book Appointment</h2>
    <form id="appointment-form">
      <div class="form-group">
        <label for="department">Department:(optional)</label>
        <select id="department" name="department" required>
          <!-- Add more options as needed -->
        </select>
      </div>
      <div class="form-group">
        <label for="doctor">Doctor Name:</label>
        <select id="doctor" name="doctor" required>
          <option value="Dr. Smith">Dr. Smith</option>
          <option value="Dr. Johnson">Dr. Johnson</option>
          <option value="Dr. Williams">Dr. Williams</option>
          <!-- Add more options as needed -->
        </select>
      </div>
      <div class="form-group">
        <label for="appointment-date">Date:</label>
        <input type="date" id="appointment-date" name="appointment-date" required>
      </div>
      <div class="form-group">
        <label for="concern">Concern:</label>
        <textarea id="concern" name="concern" rows="4" required></textarea>
      </div>
      <button type="submit">Submit</button>
    </form>
  </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
<script>
$(document).ready(async function() {
  const response = await fetch('http://localhost:5000/deptextract', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify()
  });
  const data = await response.json();
  
  var deptselect = document.getElementById('department');
  deptselect.innerHTML = '';
  var option1 = document.createElement('option');
    option1.value = 0;
    option1.text = "Select Department";
    deptselect.appendChild(option1);
  data.department.forEach(element => {
    var option = document.createElement('option');
    option.value = element.dept_id;
    option.text = element.dept_name;
    deptselect.appendChild(option);
  });
  document.getElementById('department').addEventListener('change', async function() {
    const response = await fetch('http://localhost:5000/doctor_from_department', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ dept: document.getElementById('department').value })
    });
    const data = await response.json();
    console.log(data.name);
    var doctorselect = document.getElementById('doctor');
    doctorselect.innerHTML = '';
    var option1 = document.createElement('option');
    option1.value = 0;
    option1.text = "Select Doctor";
    doctorselect.appendChild(option1);
    data.name.forEach(element => {
      var option = document.createElement('option');
      option.value = element.doctor_id;
      option.text = element.doctor_name;
      doctorselect.appendChild(option);
    });
  });
  var modal = $("#appointment-dialog");
  var btn = $("#open-appointment-dialog");
  var closeSpan = $(".close");

  btn.click(function() {
    modal.show();
  });

  closeSpan.click(function() {
    modal.hide();
  });

  $(window).click(function(event) {
    if (event.target.id === "appointment-dialog") {
      modal.hide();
    }
  });

  $('#appointment-form').submit(function(event) {
    event.preventDefault();
    var department = $('#department').val();
    var doctor = $('#doctor').val();
    var date = $('#appointment-date').val();
    var concern = $('#concern').val();
    console.log('Department:', department);
    console.log('Doctor:', doctor);
    console.log('Appointment Date:', date);
    console.log('Concern:', concern);
    modal.hide();
  });
});
</script>

</body>
</html>
