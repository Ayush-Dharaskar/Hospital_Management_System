    <section class="dashboard page">
      <!-- Banner Section -->

        <!-- First Box -->

          <img src="/doc.png" alt="docImg" />

      <!-- Appointments Table -->
      <div class="banner">
        <h5>Appointments</h5>
        <table id="appointmentsTable">
          <thead>
            <tr>
              <th>Patient</th>
              <th>Date</th>
              <th>Doctor</th>
              <th>Department</th>
              <th>Status</th>
              <th>Visited</th>
            </tr>
          </thead>
          <tbody id="appointmentsBody">
            <!-- Appointments will be dynamically inserted here -->
          </tbody>
        </table>
        <p id="noAppointments">No Appointments Found!</p>
      </div>
    </section>

    <script>
      // script.js

      document.addEventListener("DOMContentLoaded", async () => {
        // Fetch Appointments
        const fetchAppointments = async () => {
          try {
            const response = await fetch(
              "http://localhost:7878/allappointments",
              {
                credentials: "include",
              }
            );
            const { appointments } = await response.json();
            renderAppointments(appointments);
          } catch (error) {
            console.error("Error fetching appointments:", error);
          }
        };

        // Render Appointments
        const renderAppointments = (appointments) => {
          const appointmentsBody = document.getElementById("appointmentsBody");
          const noAppointments = document.getElementById("noAppointments");

          if (appointments.length > 0) {
            noAppointments.style.display = "none";
            appointmentsBody.innerHTML = appointments
              .map(
                (appointment) => `
              <tr key="${appointment._id}">
                  <td>${appointment.firstName} ${appointment.lastName}</td>
                  <td>${appointment.appointment_date.substring(0, 16)}</td>
                  <td>${appointment.doctor.firstName} ${
                  appointment.doctor.lastName
                }</td>
                  <td>${appointment.department}</td>
                  <td>
                      <select class="${appointment.status.toLowerCase()}" value="${
                  appointment.status
                }" onchange="handleUpdateStatus('${
                  appointment._id
                }', this.value)">
                          <option value="Pending">Pending</option>
                          <option value="Accepted">Accepted</option>
                          <option value="Rejected">Rejected</option>
                      </select>
                  </td>
                  <td>${
                    appointment.hasVisited
                      ? '<span class="green">&#10003;</span>'
                      : '<span class="red">&#10007;</span>'
                  }</td>
              </tr>
          `
              )
              .join("");
          } else {
            noAppointments.style.display = "block";
          }
        };

        // Handle Update Status
        window.handleUpdateStatus = async (appointmentId, status) => {
          try {
            const response = await fetch(
              `http://localhost:4000/api/v1/appointment/update/${appointmentId}`,
              {
                method: "PUT",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ status }),
                credentials: "include",
              }
            );
            const { message } = await response.json();
            console.log("Message:", message);
            fetchAppointments(); // Refresh appointments after update
          } catch (error) {
            console.error("Error updating status:", error);
          }
        };

        // Initial Fetch
        fetchAppointments();
      });
    </script>
